  <script>
    //这个是判断 没有includes 方法的
    if (!Array.prototype.includes) {
      Object.defineProperty(Array.prototype, "includes", {
        value: function (valueToFind, fromIndex) {
          if (this == null) {
            throw new TypeError('"this" is null or not defined');
          }

          // 1. Let O be ? ToObject(this value).
          var o = Object(this);

          // 2. Let len be ? ToLength(? Get(O, "length")).
          var len = o.length >>> 0;

          // 3. If len is 0, return false.
          if (len === 0) {
            return false;
          }

          // 4. Let n be ? ToInteger(fromIndex).
          //    (If fromIndex is undefined, this step produces the value 0.)
          var n = fromIndex | 0;

          // 5. If n ≥ 0, then
          //  a. Let k be n.
          // 6. Else n < 0,
          //  a. Let k be len + n.
          //  b. If k < 0, let k be 0.
          var k = Math.max(n >= 0 ? n : len - Math.abs(n), 0);

          function sameValueZero(x, y) {
            return (
              x === y ||
              (typeof x === "number" &&
                typeof y === "number" &&
                isNaN(x) &&
                isNaN(y))
            );
          }

          // 7. Repeat, while k < len
          while (k < len) {
            // a. Let elementK be the result of ? Get(O, ! ToString(k)).
            // b. If SameValueZero(valueToFind, elementK) is true, return true.
            if (sameValueZero(o[k], valueToFind)) {
              return true;
            }
            // c. Increase k by 1.
            k++;
          }

          // 8. Return false
          return false;
        },
      });
    }
  </script>
  <script src="./sdk.js"></script>
  <script>
    //1、在宿主项目的 html head script 或 项目主入口中添加如下代码
    window.webfunnyEvent = function (pointId) {
      if (window._webfunnyEvent && typeof window._webfunnyEvent === "object") {
        if (
          Object.prototype.hasOwnProperty.call(window._webfunnyEvent, pointId)
        ) {
          return window._webfunnyEvent[pointId];
        } else {
          console.warn("pointId error");
          return {
            trackEvent: () => {},
          };
        }
      } else {
        console.warn("please check SDK");
        return {
          trackEvent: () => {},
        };
      }
    };
  </script>
